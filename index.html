Nav.init({ activePage: "home", allPhasesMap: ALL_PHASES_MAP });
(function () {
  var main = document.getElementById("main-content");
  var order = Nav.PHASE_ORDER;
  function locked(id) { return Nav.isPhaseLocked(id, ALL_PHASES_MAP); }
  var html = '<div class="home-hero">' + MOUNTAIN +

  PHASE_CARDS.forEach(function (c, i) {

    var lk = locked(c.id);
    var badge = p.percent === 100 ? '<span class="tc-badge">★ Done</span>' : (lk ? '<span class="tc-pct">🔒 Locked</span>' : '<span class="tc-pct">' + p.percent + '%</span>');

      '<div class="tc-ic">' + c.icon + '</div>' +
      '<div class="tc-title">' + c.title + '</div>' +
      '<div class="tc-sub">' + c.sub + '</div>' +
      '<div class="mini-track"><div class="mini-fill" data-w="' + p.percent + '"></div></div>' +
